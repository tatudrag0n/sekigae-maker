<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>席替えメーカー</title>
<meta name="description" content="席数も列数も自由に変えられる席替えメーカー。席はドラッグで入れ替えできます。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232f6f5e'/%3E%3Ctext x='50' y='54' font-size='54' text-anchor='middle' dominant-baseline='middle' fill='%23ffffff' font-family='sans-serif'%3E%E5%B8%AD%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="page">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">席</span>
      <div class="brand-text">
        <h1>席替えメーカー</h1>
        <p class="tagline">席数は自由に、配置はドラッグで。</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button type="button" id="cheatBadge" class="cheat-badge" hidden title="不正モードを終了する">
        <span class="dot" aria-hidden="true"></span>不正モード
      </button>
      <button type="button" id="settingsToggle" class="icon-btn" aria-expanded="true" aria-controls="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6 1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        設定
      </button>
    </div>
  </header>

  <section id="settings" class="settings" aria-label="席の設定">
    <div class="field">
      <span class="field-label">人数</span>
      <div class="stepper">
        <button type="button" data-step="-1" data-target="count" aria-label="人数を減らす">−</button>
        <input id="countInput" type="number" min="1" max="60" step="1" value="24" inputmode="numeric" aria-label="人数">
        <button type="button" data-step="1" data-target="count" aria-label="人数を増やす">+</button>
      </div>
    </div>
    <div class="field">
      <span class="field-label">列数</span>
      <div class="stepper">
        <button type="button" data-step="-1" data-target="cols" aria-label="列数を減らす">−</button>
        <input id="colsInput" type="number" min="1" max="10" step="1" value="6" inputmode="numeric" aria-label="列数">
        <button type="button" data-step="1" data-target="cols" aria-label="列数を増やす">+</button>
      </div>
    </div>
    <p id="layoutSummary" class="layout-summary">4行 × 6列 ／ 24席</p>
    <div class="settings-actions">
      <button type="button" id="resetBtn" class="ghost-btn">番号順に戻す</button>
      <button type="button" id="shuffleBtn" class="primary-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></svg>
        席替えする
      </button>
    </div>
  </section>

  <main class="classroom">
    <div class="board" aria-hidden="true"><span>黒 板</span></div>
    <p id="warn" class="warn" hidden></p>
    <div id="seatGrid" class="seat-grid" aria-label="座席表"></div>
    <p id="hint" class="hint">席をドラッグすると入れ替えできます</p>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
